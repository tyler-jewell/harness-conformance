name: harness-conformance run
description: Install pinned harness CLIs, run the lockstep scenarios against the local mock model server and upload the matrix. Needs no secrets and no network access to any model provider.
inputs:
  harnesses:
    description: Comma list of harnesses that must be installed and conform (explicit in CI for reproducibility)
    default: claude,opencode,grok
  advisory:
    description: Comma list of harnesses that are run and reported but never gate (unverified drivers)
    default: codex,pi
  channel:
    description: pinned (versions from pins/) or latest (nightly drift detection)
    default: pinned
  leg:
    description: Unique name of this matrix leg (artifact suffix)
    required: true
  siblings-dir:
    description: Directory holding checkouts of dotfiles/, agents/, lsp-doctor/, harness-inventory/ (optional; fixtures are used for missing ones)
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
        package-manager-cache: false
    - name: Install harnesses (${{ inputs.channel }})
      shell: bash
      env:
        CHANNEL: ${{ inputs.channel }}
        ONLY: ${{ inputs.harnesses }},${{ inputs.advisory }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        cd "$ACTION_PATH/../../.."
        bash scripts/install-harnesses.sh --channel "$CHANNEL" --only "$ONLY"
    - name: Doctor
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        HC_SIBLINGS_DIR: ${{ inputs.siblings-dir }}
      run: |
        cd "$ACTION_PATH/../../.."
        node bin/harness-conformance doctor
    - name: Run lockstep scenarios
      id: run
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        HC_SIBLINGS_DIR: ${{ inputs.siblings-dir }}
        HARNESSES: ${{ inputs.harnesses }}
        ADVISORY: ${{ inputs.advisory }}
        LEG: ${{ inputs.leg }}
        HC_TMPDIR: ${{ runner.temp }}
      run: |
        cd "$ACTION_PATH/../../.."
        mkdir -p "$RUNNER_TEMP/hc-out"
        args=()
        IFS=, read -r -a hs <<<"$HARNESSES,$ADVISORY"
        for h in "${hs[@]}"; do [ -n "$h" ] && args+=(--harness "$h"); done
        set +e
        node bin/harness-conformance run "${args[@]}" --require-installed \
          --out "$RUNNER_TEMP/hc-out/matrix-$LEG.json" --summary "$RUNNER_TEMP/hc-out/matrix-$LEG.md" --github-summary >/dev/null
        rc=$?
        echo "rc=$rc" >>"$GITHUB_OUTPUT"
        exit 0
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: matrix-${{ inputs.leg }}
        path: ${{ runner.temp }}/hc-out/
        if-no-files-found: warn
        retention-days: 30
    - name: Fail on divergence
      shell: bash
      env:
        RC: ${{ steps.run.outputs.rc }}
      run: |
        [ "${RC:-1}" = 0 ] || { echo "::error::lockstep divergence on this leg (see the job summary and the matrix artifact)"; exit 1; }
